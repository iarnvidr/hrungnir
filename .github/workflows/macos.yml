name: macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin && rustup default stable

      - name: Install pinned Rust Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            src-tauri

      - name: Restore media helper cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/media-tools
          key: media-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-media-tools.py', 'scripts/ffmpeg_lgpl.py') }}

      - name: Install helper build tools
        run: brew install meson ninja pkgconf minisign

      - name: Fetch media helpers (builds LGPL-only FFmpeg and dav1d from source)
        run: python3 scripts/fetch-media-tools.py

      - name: Test updater signing and tamper rejection
        run: python3 scripts/test-updater-package.py

      - name: Exercise media encode, merge and poster generation
        run: python3 scripts/test-media-tools.py

      - name: Build (unsigned)
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --target aarch64-apple-darwin --features custom-protocol

      - name: Test
        run: |
          # macOS /var is a system symlink; fixtures need its physical path.
          export TMPDIR="$(python3 -c 'import pathlib, tempfile; print(pathlib.Path(tempfile.gettempdir()).resolve())')"
          cargo test --locked
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          python3 scripts/test-ffmpeg-lgpl.py
          python3 scripts/test-macos-policy.py
          python3 scripts/test-actions-native-reader.py

      - name: Assemble app bundle
        run: python3 scripts/package-macos.py

      - name: Ad-hoc sign (no identity or secrets)
        run: |
          app="artifacts/Hrungnir.app"
          codesign --force --sign - "$app/Contents/Resources/bin/yt-dlp"
          codesign --force --sign - "$app/Contents/Resources/bin/ffmpeg"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Archive signed app
        run: |
          python3 scripts/archive-macos.py
          (cd artifacts && shasum -a 256 -c Hrungnir-*.zip.sha256)

      - name: Verify extracted app and run packaged CLI
        run: |
          verification_dir="$(mktemp -d "$RUNNER_TEMP/hrungnir-archive.XXXXXX")"
          ditto -x -k artifacts/Hrungnir-*.zip "$verification_dir"
          app="$verification_dir/Hrungnir.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          python3 scripts/ffmpeg_lgpl.py verify "$app/Contents/Resources/bin/ffmpeg"
          "$app/Contents/MacOS/offline-reader-desktop" --cli --data-dir "$verification_dir/cache" doctor

      - name: Bind accepted native archive to producing run
        run: python3 scripts/release-artifact.py receipt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # PR runs feed main acceptance mapping. Manual main runs remain an explicit fallback.
        id: native-artifact
        with:
          name: hrungnir-macos-arm64-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/native-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Build isolated hidden native test app
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        run: cargo tauri build --debug --no-bundle --target aarch64-apple-darwin --config src-tauri/tauri.test.conf.json

      - name: Package and bind native test artifact
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/package-macos.py --test
          app="artifacts/native-test/Hrungnir Test.app"
          codesign --force --sign - "$app/Contents/Resources/bin/yt-dlp"
          codesign --force --sign - "$app/Contents/Resources/bin/ffmpeg"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          archive="artifacts/native-test/Hrungnir-Test-$version-macos-arm64.zip"
          python3 scripts/archive-macos.py --test
          python3 scripts/actions-native-reader.py receipt \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-head "$SOURCE_HEAD" --checkout-sha "$GITHUB_SHA" \
            --version "$version" --archive "$archive" \
            --output artifacts/native-test/test-receipt.json

      - name: Upload isolated native test app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hrungnir-native-reader-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/native-test/*.zip
            artifacts/native-test/test-receipt.json
          if-no-files-found: error
          retention-days: 30
