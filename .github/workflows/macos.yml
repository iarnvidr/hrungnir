name: macOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Restore media helper cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/media-tools
          key: media-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-media-tools.py', 'scripts/ffmpeg_lgpl.py') }}

      - name: Fetch media helpers (builds LGPL-only FFmpeg from source)
        run: python3 scripts/fetch-media-tools.py

      - name: Build (unsigned)
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --target aarch64-apple-darwin --features custom-protocol

      - name: Test
        run: |
          cargo test --locked
          python3 scripts/test-ffmpeg-lgpl.py

      - name: Assemble app bundle
        run: python3 scripts/package-macos.py

      - name: Ad-hoc sign (no identity or secrets)
        run: |
          app="artifacts/Hrungnir.app"
          codesign --force --sign - "$app/Contents/Resources/bin/yt-dlp"
          codesign --force --sign - "$app/Contents/Resources/bin/ffmpeg"
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
