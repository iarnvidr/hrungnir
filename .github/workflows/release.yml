name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: candidate
      - name: Checkout trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          path: policy
      - name: Retrieve exact accepted native artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python3 policy/scripts/release-artifact.py retrieve --root "$GITHUB_WORKSPACE/candidate" --tag "$TAG"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install trusted signing tools without source lifecycle scripts
        working-directory: policy
        run: |
          npm ci --ignore-scripts
          brew install minisign
      - name: Unpack verified input for signing
        run: |
          ditto -x -k candidate/artifacts/Hrungnir-*.zip candidate/artifacts
          ln -s "$GITHUB_WORKSPACE/policy/node_modules" candidate/node_modules
      - name: Sign updater transformation using trusted policy
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing updater signing key" >&2; exit 1; }
          python3 - <<'PY'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location('signer', 'policy/scripts/package-updater.py')
          signer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(signer)
          signer.package(pathlib.Path('candidate').resolve())
          PY
      - name: Record transformed output identities
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('candidate/artifacts')
          record = json.loads((root / 'release-input.json').read_text())
          record['transformed_files'] = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.iterdir() if p.is_file() and p.name.endswith(('.app.tar.gz', '.app.tar.gz.sig', 'latest.json'))}
          if len(record['transformed_files']) != 3:
              raise SystemExit('Unexpected transformed artifact inventory')
          (root / 'release-output.json').write_text(json.dumps(record, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hrungnir-macos-arm64
          path: |
            candidate/artifacts/*.zip
            candidate/artifacts/*.zip.sha256
            candidate/artifacts/*.app.tar.gz
            candidate/artifacts/*.app.tar.gz.sig
            candidate/artifacts/latest.json
            candidate/artifacts/release-input.json
            candidate/artifacts/release-output.json
          if-no-files-found: error

  qualify:
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hrungnir-macos-arm64
          path: dist
      - name: Verify transformed bytes and extracted signed app without publication credentials
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('dist')
          record = json.loads((root / 'release-output.json').read_text())
          for name, digest in {**record['files'], **record['transformed_files']}.items():
              if pathlib.Path(name).name != name or hashlib.sha256((root / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Transformed artifact checksum mismatch')
          PY
          (cd dist && shasum -a 256 -c Hrungnir-*.zip.sha256)
          verification_dir="$(mktemp -d "$RUNNER_TEMP/hrungnir-release.XXXXXX")"
          tar -xzf dist/*.app.tar.gz -C "$verification_dir"
          codesign --verify --deep --strict --verbose=2 "$verification_dir/Hrungnir.app"
          "$verification_dir/Hrungnir.app/Contents/MacOS/offline-reader-desktop" --cli --data-dir "$verification_dir/cache" doctor

  release:
    needs: [build, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hrungnir-macos-arm64
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - name: Create GitHub Release from qualified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="source/docs/RELEASE-${TAG#v}.md"
          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 dist/*.app.tar.gz dist/*.app.tar.gz.sig dist/latest.json dist/release-input.json dist/release-output.json \
            --verify-tag --title "Hrungnir ${TAG#v}" --notes-file "$notes"
